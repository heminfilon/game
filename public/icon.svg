<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#242733"/>
      <stop offset="60%" stop-color="#14151b"/>
      <stop offset="100%" stop-color="#0a0b0e"/>
    </radialGradient>

    <!-- Rich Terracotta Pot Clay Gradient -->
    <linearGradient id="clayGrad" x1="20%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#e08848"/>
      <stop offset="25%" stop-color="#c86930"/>
      <stop offset="70%" stop-color="#9a431c"/>
      <stop offset="100%" stop-color="#64240a"/>
    </linearGradient>

    <!-- Inner Shadow for Rim Lip -->
    <linearGradient id="lipGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3d1406"/>
      <stop offset="100%" stop-color="#1a0701"/>
    </linearGradient>

    <!-- Warm Studio Spotlight Highlight -->
    <linearGradient id="clayHighlight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.35"/>
    </linearGradient>

    <!-- Pedestal Shadow -->
    <radialGradient id="pedestalShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Gold Border Ring -->
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe89e"/>
      <stop offset="50%" stop-color="#c99738"/>
      <stop offset="100%" stop-color="#7a5416"/>
    </linearGradient>

    <!-- Filter for soft clay depth -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- App Icon Squircle Container -->
  <rect width="512" height="512" rx="116" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="112" fill="none" stroke="url(#goldBorder)" stroke-width="3" opacity="0.6"/>

  <!-- Pedestal Shadow -->
  <ellipse cx="256" cy="428" rx="150" ry="26" fill="url(#pedestalShadow)"/>

  <!-- Turntable Wooden Base -->
  <ellipse cx="256" cy="422" rx="136" ry="16" fill="#1b1c22" stroke="#373944" stroke-width="2"/>
  <ellipse cx="256" cy="420" rx="100" ry="8" fill="#282a34"/>

  <!-- ============================================== -->
  <!-- 3D TERRACOTTA POT VESSEL SILHOUETTE            -->
  <!-- ============================================== -->
  <g id="pottery-body">
    <!-- Main Pot Contour -->
    <path d="M 186 130 
             Q 256 136 326 130
             Q 305 180 268 210
             Q 180 255 178 335
             Q 180 405 256 405
             Q 332 405 334 335
             Q 332 255 244 210
             Q 207 180 186 130 Z" 
          fill="url(#clayGrad)"/>

    <!-- Shading Overlay for 3D Volume -->
    <path d="M 186 130 
             Q 256 136 326 130
             Q 305 180 268 210
             Q 180 255 178 335
             Q 180 405 256 405
             Q 332 405 334 335
             Q 332 255 244 210
             Q 207 180 186 130 Z" 
          fill="url(#clayHighlight)"/>

    <!-- Outer Rim Lip Curve -->
    <ellipse cx="256" cy="130" rx="70" ry="14" fill="#f19452"/>
    <!-- Inner Cavity -->
    <ellipse cx="256" cy="130" rx="55" ry="10" fill="url(#lipGrad)"/>
  </g>

  <!-- ============================================== -->
  <!-- WARLI TRIBAL ART PAINTING (WHITE RICE PIGMENT)  -->
  <!-- ============================================== -->
  <g id="warli-art" fill="#fffdfa" stroke="#fffdfa" stroke-linecap="round" stroke-linejoin="round">

    <!-- 1. NECK BORDER: Triangular Sawtooth & Dotted Band -->
    <g id="neck-band" opacity="0.95">
      <path d="M 215 156 Q 256 162 297 156" fill="none" stroke-width="2.5"/>
      <path d="M 210 166 Q 256 173 302 166" fill="none" stroke-width="2"/>
      
      <!-- Sawtooth Triangles -->
      <polygon points="218,165 224,158 230,166"/>
      <polygon points="230,166 236,158 242,166"/>
      <polygon points="242,166 248,158 254,166"/>
      <polygon points="254,166 260,158 266,166"/>
      <polygon points="266,166 272,158 278,166"/>
      <polygon points="278,166 284,158 290,166"/>
      <polygon points="290,166 296,158 302,165"/>

      <!-- Sacred Sun Motif in Center of Neck -->
      <circle cx="256" cy="186" r="4.5"/>
      <line x1="256" y1="177" x2="256" y2="180" stroke-width="1.8"/>
      <line x1="256" y1="192" x2="256" y2="195" stroke-width="1.8"/>
      <line x1="247" y1="186" x2="250" y2="186" stroke-width="1.8"/>
      <line x1="262" y1="186" x2="265" y2="186" stroke-width="1.8"/>
      <line x1="250" y1="180" x2="252" y2="182" stroke-width="1.6"/>
      <line x1="260" y1="190" x2="262" y2="192" stroke-width="1.6"/>
      <line x1="250" y1="192" x2="252" y2="190" stroke-width="1.6"/>
      <line x1="260" y1="182" x2="262" y2="180" stroke-width="1.6"/>
    </g>

    <!-- 2. UPPER WAIST: Chevron Rhythmic Band -->
    <g id="waist-border" opacity="0.9">
      <path d="M 230 216 Q 256 222 282 216" fill="none" stroke-width="2"/>
      <path d="M 226 226 Q 256 233 286 226" fill="none" stroke-width="2"/>
      <!-- Dots -->
      <circle cx="236" cy="221" r="1.8"/>
      <circle cx="244" cy="222" r="1.8"/>
      <circle cx="252" cy="223" r="1.8"/>
      <circle cx="260" cy="223" r="1.8"/>
      <circle cx="268" cy="222" r="1.8"/>
      <circle cx="276" cy="221" r="1.8"/>
    </g>

    <!-- 3. CENTRAL BELLY: THE ICONIC WARLI DANCERS (TARPA CIRCLE) -->
    <g id="warli-dancers" opacity="0.98">
      <!-- Upper & Lower framing arches -->
      <path d="M 188 270 Q 256 288 324 270" fill="none" stroke-width="2.5"/>
      <path d="M 186 352 Q 256 376 326 352" fill="none" stroke-width="2.5"/>

      <!-- DANCER 1 (Left Wing) -->
      <g transform="translate(202, 292)">
        <circle cx="7" cy="4" r="3.2"/>
        <!-- Torso: Two inverted triangles joined at vertex -->
        <polygon points="1,9 13,9 7,16"/>
        <polygon points="1,23 13,23 7,16"/>
        <!-- Legs -->
        <line x1="4" y1="23" x2="1" y2="31" stroke-width="2"/>
        <line x1="10" y1="23" x2="13" y2="31" stroke-width="2"/>
        <!-- Arms arched holding hand -->
        <path d="M 7,12 Q -2,15 0,22" fill="none" stroke-width="2"/>
        <path d="M 7,12 Q 16,14 20,22" fill="none" stroke-width="2"/>
      </g>

      <!-- DANCER 2 (Left Center) -->
      <g transform="translate(225, 298)">
        <circle cx="7" cy="4" r="3.2"/>
        <polygon points="1,9 13,9 7,16"/>
        <polygon points="1,23 13,23 7,16"/>
        <line x1="4" y1="23" x2="2" y2="32" stroke-width="2"/>
        <line x1="10" y1="23" x2="12" y2="32" stroke-width="2"/>
        <path d="M 7,12 Q -1,15 -3,22" fill="none" stroke-width="2"/>
        <path d="M 7,12 Q 16,14 19,22" fill="none" stroke-width="2"/>
      </g>

      <!-- DANCER 3 (CENTER HERO - Tarpa Musician / Master Potter) -->
      <g transform="translate(249, 301)">
        <!-- Head with ceremonial feather headdress -->
        <circle cx="7" cy="4" r="3.6"/>
        <line x1="7" y1="1" x2="7" y2="-4" stroke-width="1.8"/>
        <line x1="5" y1="1" x2="3" y2="-3" stroke-width="1.5"/>
        <line x1="9" y1="1" x2="11" y2="-3" stroke-width="1.5"/>
        <!-- Torso -->
        <polygon points="0,9 14,9 7,17"/>
        <polygon points="0,25 14,25 7,17"/>
        <!-- Dynamic dancing bent legs -->
        <line x1="4" y1="25" x2="0" y2="33" stroke-width="2.2"/>
        <line x1="10" y1="25" x2="15" y2="33" stroke-width="2.2"/>
        <!-- Playing the sacred trumpet / Tarpa instrument -->
        <path d="M 7,12 Q 13,10 18,7" fill="none" stroke-width="2.2"/>
        <path d="M 18,7 L 26,4 L 27,9 Z" fill="#fffdfa"/>
        <!-- Left arm connecting to dancer 2 -->
        <path d="M 7,13 Q -2,16 -5,22" fill="none" stroke-width="2"/>
      </g>

      <!-- DANCER 4 (Right Center) -->
      <g transform="translate(275, 298)">
        <circle cx="7" cy="4" r="3.2"/>
        <polygon points="1,9 13,9 7,16"/>
        <polygon points="1,23 13,23 7,16"/>
        <line x1="4" y1="23" x2="2" y2="32" stroke-width="2"/>
        <line x1="10" y1="23" x2="12" y2="32" stroke-width="2"/>
        <path d="M 7,12 Q -2,14 -7,22" fill="none" stroke-width="2"/>
        <path d="M 7,12 Q 16,15 18,22" fill="none" stroke-width="2"/>
      </g>

      <!-- DANCER 5 (Right Wing) -->
      <g transform="translate(298, 292)">
        <circle cx="7" cy="4" r="3.2"/>
        <polygon points="1,9 13,9 7,16"/>
        <polygon points="1,23 13,23 7,16"/>
        <line x1="4" y1="23" x2="1" y2="31" stroke-width="2"/>
        <line x1="10" y1="23" x2="13" y2="31" stroke-width="2"/>
        <path d="M 7,12 Q -2,14 -5,22" fill="none" stroke-width="2"/>
        <path d="M 7,12 Q 15,16 14,22" fill="none" stroke-width="2"/>
      </g>

      <!-- Traditional Warli Antelope / Deer Motifs (Symbol of forest harmony) -->
      <!-- Deer on Left -->
      <g transform="translate(192, 332)">
        <!-- Body: Two joined triangles -->
        <polygon points="0,4 8,0 4,8"/>
        <polygon points="8,10 0,6 4,8"/>
        <!-- Head & Antlers -->
        <circle cx="9" cy="0" r="1.6"/>
        <line x1="9" y1="0" x2="13" y2="-4" stroke-width="1.2"/>
        <line x1="10" y1="-2" x2="12" y2="-1" stroke-width="1.2"/>
        <!-- Legs -->
        <line x1="1" y1="5" x2="0" y2="12" stroke-width="1.4"/>
        <line x1="7" y1="8" x2="8" y2="13" stroke-width="1.4"/>
      </g>

      <!-- Deer on Right -->
      <g transform="translate(308, 332)">
        <polygon points="8,4 0,0 4,8"/>
        <polygon points="0,10 8,6 4,8"/>
        <circle cx="-1" cy="0" r="1.6"/>
        <line x1="-1" y1="0" x2="-5" y2="-4" stroke-width="1.2"/>
        <line x1="-2" y1="-2" x2="-4" y2="-1" stroke-width="1.2"/>
        <line x1="7" y1="5" x2="8" y2="12" stroke-width="1.4"/>
        <line x1="1" y1="8" x2="0" y2="13" stroke-width="1.4"/>
      </g>
    </g>

    <!-- 4. BASE BORDER: Chevron Sawtooth & Running Spirals -->
    <g id="base-border" opacity="0.92">
      <path d="M 205 372 Q 256 388 307 372" fill="none" stroke-width="2"/>
      <path d="M 215 384 Q 256 397 297 384" fill="none" stroke-width="2"/>
      
      <!-- Zigzag chevron spikes -->
      <polyline points="216,380 221,374 226,380 231,374 236,380 241,374 246,380 251,374 256,380 261,374 266,380 271,374 276,380 281,374 286,380 291,374 296,380" 
                fill="none" stroke-width="1.8"/>

      <!-- Base dots -->
      <circle cx="230" cy="391" r="1.6"/>
      <circle cx="240" cy="393" r="1.6"/>
      <circle cx="250" cy="394" r="1.6"/>
      <circle cx="260" cy="394" r="1.6"/>
      <circle cx="270" cy="393" r="1.6"/>
      <circle cx="280" cy="391" r="1.6"/>
    </g>
  </g>

  <!-- Specular Ceramic Glaze Arc Highlight (Gives the icon a sleek 3D depth) -->
  <path d="M 220 145 
           Q 210 200 200 280
           Q 196 320 205 365" 
        fill="none" 
        stroke="#ffffff" 
        stroke-width="5" 
        stroke-linecap="round" 
        opacity="0.22" 
        filter="url(#softGlow)"/>
</svg>
